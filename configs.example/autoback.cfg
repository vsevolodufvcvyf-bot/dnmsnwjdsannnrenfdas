[Autoback]
enabled = 1
# ask — присылать в Telegram кнопки «вернуть / не возвращать»
# auto — возвращать самому, но только в пределах лимитов ниже, остальное — кнопками
mode = ask
max_refund_rub = 300.0
min_stars = 1
max_stars = 3
# автоматически: не больше стольких возвратов одному покупателю за 30 дней
buyer_limit_30d = 1
# автоматически: не больше этой суммы возвратов за день
daily_limit_rub = 1000
# автоматически не возвращать за товар, который бот уже выдал сам
skip_if_delivered = 1
# 1 — операторам тоже можно нажимать «вернуть», 0 — только владельцу
refund_by_operators = 0
send_buyer_message = 1
buyer_message = Здравствуйте! Оформили полный возврат средств по вашему заказу #{order_id}. Приносим извинения за неудобства.
