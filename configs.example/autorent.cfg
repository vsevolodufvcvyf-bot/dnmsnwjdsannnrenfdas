[AutoRent]
enabled = 1
# После аренды слот закрыт, пока не сменишь пароль (/rentpass ID пароль или кнопка)
require_reset = 1
# Сколько кодов Steam Guard можно получить за одну аренду (0 — без лимита)
max_codes_per_rent = 10
# Максимальный срок одной аренды в часах (больше — выдача вручную)
max_rent_hours = 336
